<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <section class="todo-card" aria-labelledby="todo-title">
        <p class="eyebrow">Simple Planner</p>
        <h1 id="todo-title">Todo App</h1>
        <p class="subtitle">Add tasks, track them, and remove them when they’re done.</p>

        <form class="todo-form" id="todo-form">
          <label class="sr-only" for="todo-input">Add a new todo</label>
          <input
            id="todo-input"
            name="todo"
            type="text"
            placeholder="What needs to be done?"
            autocomplete="off"
          />
          <button type="submit">Add Todo</button>
        </form>

        <ul class="todo-list" id="todo-list" aria-live="polite" aria-relevant="additions removals"></ul>
      </section>
    </main>
  </body>
</html>
